version: "3.9"
services:
  api:
    build: .
    environment:
      HTTP_ADDR: :8080
      DB_DRIVER: sqlite
      DATABASE_URL: file:/data/fuzzy.db?cache=shared&_pragma=busy_timeout=5000
      JWT_SECRET: dev-secret-change-me
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - db_data:/data
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
  uploads:

